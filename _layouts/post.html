---
layout: default
---
<style>
.post-header{margin-bottom:32px}
.post-header h1{font-size:1.5rem;font-weight:600;line-height:1.3;margin-bottom:10px}
.post-meta{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.back{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--muted);display:inline-block;margin-bottom:32px}
.back:hover{color:var(--accent);text-decoration:none}
.post-body{font-size:.95rem;color:var(--muted)}
.post-body h2{color:var(--text);font-family:"Inter",sans-serif;font-size:1.05rem;font-weight:600;margin:28px 0 8px}
.post-body h3{color:var(--text);font-size:.95rem;font-weight:600;margin:20px 0 6px}
.post-body p{margin-bottom:14px;color:var(--muted)}
.post-body ul,.post-body ol{padding-left:20px;margin-bottom:14px}
.post-body li{margin-bottom:6px}
.post-body code{font-family:"JetBrains Mono",monospace;font-size:.85rem;background:var(--bg2);border:1px solid var(--border);padding:1px 6px;border-radius:3px}
.post-body pre{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;overflow-x:auto;margin-bottom:16px}
.post-body pre code{background:none;border:0;padding:0}
.post-body strong{color:var(--text);font-weight:600}
.post-footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--border)}
</style>

<a class="back" href="javascript:history.back()">← back</a>

<div class="post-header">
  <div class="post-meta">
    <span>{{ page.date | date: "%b %d, %Y" }}</span>
    {% if page.category %}<span>{{ page.category }}</span>{% endif %}
  </div>
  <h1>{{ page.title }}</h1>
  {% if page.tags %}
  <div class="tags">
    {% for tag in page.tags %}
    <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}
</div>

<div class="post-body">
  {{ content }}
</div>

<div class="post-footer">
  <a class="back" href="javascript:history.back()">← back</a>
</div>
